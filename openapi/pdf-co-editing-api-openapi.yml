                  $ref: '#/components/schemas/regex'
                casesensitive:
                  allOf:
                  - $ref: '#/components/schemas/casesensitive'
                  default: true
                replacementlimit:
                  $ref: '#/components/schemas/replacementlimit'
                makeunsearchable:
                  $ref: '#/components/schemas/makeunsearchable'
                pages:
