  /v1/pdf/edit/delete-text:
    post:
      tags:
      - Editing
      x-mint:
        href: /api-tester/pdf-search-text-and-delete
      operationId: post_v1_pdf_edit_delete-text
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  $ref: '#/components/schemas/file'
                url:
                  allOf:
                  - $ref: '#/components/schemas/url'
                  default: https://pdfco-test-files.s3.us-west-2.amazonaws.com/pdf-search-and-replace/sample-agreement-template-signature-page-1.pdf
                searchstring:
                  $ref: '#/components/schemas/searchstring'
                searchstrings:
                  allOf:
                  - $ref: '#/components/schemas/searchstrings'
                  default:
                  - '[CLIENT-NAME]'
                  - '[CLIENT-COMPANY]'
                  - '[CLIENT-SIGNATURE]'
                  - 1 FEB 2023
                regex:
                  $ref: '#/components/schemas/regex'
                casesensitive:
                  $ref: '#/components/schemas/casesensitive'
                replacementlimit:
                  allOf:
                  - $ref: '#/components/schemas/replacementlimit'
                  default: 2
                makeunsearchable:
                  $ref: '#/components/schemas/makeunsearchable'
                pages:
                  type: string
                  description: 'Page indices/ranges (0-based). Items are comma-separated. Each item is one of: N (e.g., 0), N-M (e.g., 3-7), N- (open-ended, e.g., 10-), Whitespace is allowed. If not specified, the default configuration processes all pages.'
                  example: 1,2,3-7
                  default: all pages
                name:
                  $ref: '#/components/schemas/name'
                async:
                  allOf:
                  - $ref: '#/components/schemas/async'
                  default: false
                password:
                  $ref: '#/components/schemas/password'
                timeout:
                  $ref: '#/components/schemas/timeout'
                expiration:
                  $ref: '#/components/schemas/expiration'
                profiles:
                  allOf:
                  - $ref: '#/components/schemas/profiles'
                  default: '{''UsePatch'': true, ''PatchColor'': ''#000000''}'
                httpusername:
                  $ref: '#/components/schemas/httpusername'
                httppassword:
                  $ref: '#/components/schemas/httppassword'
              additionalProperties: false
              required:
              - url
        required: false
