  /v1/pdf/attachments/extract:
    post:
      tags:
      - Extraction
      x-mint:
        href: /api-tester/pdf-extract-attachments
      operationId: post_v1_pdf_attachments_extract
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  allOf:
                  - $ref: '#/components/schemas/url'
